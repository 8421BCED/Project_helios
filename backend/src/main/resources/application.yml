server:
  port: 8080

spring:
  application:
    name: helios-backend
  profiles:
    include: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/helios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:2525}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

helios:
  storage-path: data/satellites.json
  keys:
    openweather: ${OPENWEATHER_API_KEY:placeholder}
    nasa: ${NASA_API_KEY:placeholder}
  spacetrack:
    identity: ""
    password: ""

logging:
  level:
    org.springframework.web: INFO
    com.helios: DEBUG
